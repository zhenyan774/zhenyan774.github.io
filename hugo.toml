baseURL = 'https://zhenyan774.github.io/'
languageCode = 'en-us'
title = 'Zhenyan Zhang | Quant Researcher & Trader'
theme = 'PaperMod'

# 核心：修复 "Author" 报错需要加这个
[author]
    name = "Zhenyan Zhang"

[params]
    env = "production"
    description = "my personal website"
    author = "Zhenyan Zhang"

    # 首页配置
    [params.homeInfoParams]
        Title = "Hello, I'm Zhenyan 👋"
        Content = """I am interested in understanding the mechanisms behind financial market behavior. My work combines mathematics, statistical modeling, and machine learning to study financial phenomena and translate these insights into quantitative trading strategies and risk management tools. I am currently pursuing a Master’s degree in Financial Engineering, while actively developing systematic trading models and exploring how mathematical frameworks can help explain and navigate real market dynamics."""

    # 社交链接
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/zhenyan774"
    [[params.socialIcons]]
        name = "linkedin"
        url = "https://linkedin.com/in/ZhenyanZhang1556510774" # 记得换成真的

[menu]
    [[menu.main]]
        name = "Projects"
        url = "/projects/"
        weight = 10
    [[menu.main]]
        name = "Blog"
        url = "/blog/"
        weight = 20

# 解决你截图中的 HTML 警告
[markup.goldmark.renderer]
    unsafe = true