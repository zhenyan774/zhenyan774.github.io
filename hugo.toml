baseURL = 'https://zhenyan774.github.io/'
languageCode = 'zh-cn'
title = '我的个人作品集'
theme = 'PaperMod'

# 核心：修复 "Author" 报错需要加这个
[author]
    name = "你的名字"

[params]
    env = "production"
    description = "我的个人简历网站"
    author = "你的名字"

    # 首页配置
    [params.homeInfoParams]
        Title = "你好，我是 [你的名字] 👋"
        Content = "欢迎来到我的个人网站。我是一名正在寻找实习/工作的学生，专注于 [你的领域]。"

    # 社交链接
    [[params.socialIcons]]
        name = "github"
        url = "https://github.com/[你的用户名]"
    [[params.socialIcons]]
        name = "email"
        url = "mailto:your-email@example.com"

# 解决你截图中的 HTML 警告
[markup.goldmark.renderer]
    unsafe = true